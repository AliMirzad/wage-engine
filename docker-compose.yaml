services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: accounting_db
      POSTGRES_USER: accounting_user
      POSTGRES_PASSWORD: accounting_pass
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accounting_user -d accounting_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/accounting_db
      DB_USER: accounting_user
      DB_PASSWORD: accounting_pass
      JWT_SECRET: dev-secret-min-256-bits-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      SUPER_ADMIN_PASSWORD: ChangeMe@123
    ports:
      - "8080:8080"

volumes:
  pgdata: