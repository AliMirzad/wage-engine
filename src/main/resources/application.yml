spring:
  application:
    name: wage-engine

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/accounting_db}
    username: ${DB_USER:accounting_user}
    password: ${DB_PASSWORD:accounting_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    clean-disabled: false
  web:
    error:
      include-binding-errors: always
      include-message: always

server:
  port: ${PORT:8080}
  error:
  include-stacktrace: always
  include-message: always

app:
  security:
    jwt:
      secret: ${JWT_SECRET:CHANGE_ME_IN_PROD_min_32_bytes_base64_encoded_secret_key_here_1234567890}
      access-token-expiration: 900000
      refresh-token-expiration: 604800000
      issuer: "accounting-app"
    password:
      min-length: 8
      require-letter: true
      require-digit: true
    login-attempt:
      max-attempts: 5
      lock-duration-minutes: 15
    password-reset:
      token-expiration-minutes: 30
    cors:
      enabled: false
    super-admin:
      enabled: true
      username: ${SUPER_ADMIN_USERNAME:admin}
      email: ${SUPER_ADMIN_EMAIL:admin@accounting.local}
      password: ${SUPER_ADMIN_PASSWORD:ChangeMe@123}

logging:
  level:
    org.flywaydb: INFO
    org.springframework.boot.autoconfigure.flyway: INFO
    ir.manaz: DEBUG
    org.springframework.security: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: false
  packages-to-scan: ir.manaz
