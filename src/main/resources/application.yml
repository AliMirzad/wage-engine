spring:
  application:
    name: wage-engine

  datasource:
    url: jdbc:postgresql://localhost:5432/accounting_db
    username: accounting_user
    password: accounting_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    clean-disabled: false
  web:
    error:
      include-binding-errors: always
      include-message: always

server:
  port: 8080

app:
  security:
    jwt:
      #todo CHANGE THIS after deploy
      secret: "CHANGE_ME_IN_PROD_min_32_bytes_base64_encoded_secret_key_here_1234567890"
      access-token-expiration: 900000       # 15 minutes (ms)
      refresh-token-expiration: 604800000   # 7 days (ms)
      issuer: "accounting-app"
    password:
      min-length: 8
      require-letter: true
      require-digit: true
    login-attempt:
      max-attempts: 5
      lock-duration-minutes: 15
    password-reset:
      token-expiration-minutes: 30
    cors:
      enabled: false
    super-admin:
      enabled: true
      username: admin
      email: admin@accounting.local
      #todo CHANGE THIS after first login!
      password: "ChangeMe@123"

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: TRACE
    com.accounting.security: DEBUG
    org.springframework.security: INFO


ErrorResponse:
  type: object
  properties:
    timestamp:
      type: string
      format: date-time
    status:
      type: integer
      example: 404
    error:
      type: string
      example: Not Found
    code:
      type: string
      description: Machine-readable error code (dot-separated key)
      example: employee.not_found
    message:
      type: string
      description: Human-readable Persian message
      example: کارمند با شناسه ۴۲ یافت نشد
    path:
      type: string
      example: /api/v1/employees/42

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: false
  packages-to-scan: ir.manaz